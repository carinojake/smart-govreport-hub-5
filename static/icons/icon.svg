  <circle cx="256" cy="205" r="10" fill="#FFFFFF" />
  <text x="256" y="445" font-family="'Prompt', 'Sarabun', sans-serif" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">GOVREPORT</text>
