# ==============================================================================
# Nginx Reverse Proxy Configuration for Smart GovReport Hub 2.5
# รองรับ HTTPS/SSL, Gzip Compression, Security Headers และ Web Speech API
# ==============================================================================

# 1. บังคับเปลี่ยนเส้นทาง HTTP (Port 80) -> HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name smartgov.yourdomain.go.th; # เปลี่ยนเป็นโดเมนจริงของหน่วยงาน

    # ปล่อยผ่านสำหรับการต่ออายุใบรับรอง SSL (Let's Encrypt Certbot Challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Server Block หลักสำหรับ HTTPS (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smartgov.yourdomain.go.th; # เปลี่ยนเป็นโดเมนจริงของหน่วยงาน

    # การตั้งค่าใบรับรอง SSL/TLS (Let's Encrypt)
    # *สำคัญ*: จำเป็นอย่างยิ่งเพื่อให้เบราว์เซอร์อนุญาตให้ใช้ Web Speech API (พิมพ์ด้วยเสียง)
    ssl_certificate /etc/letsencrypt/live/smartgov.yourdomain.go.th/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartgov.yourdomain.go.th/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ขนาดไฟล์อัปโหลดสูงสุด (สำหรับแนบรูปภาพกิจกรรม OJT และรายงาน A4)
    client_max_body_size 25M;

    # มาตรการความมั่นคงปลอดภัยสารสนเทศภาครัฐ (Security Headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # เปิดใช้งาน Gzip Compression เพื่อลดปริมาณ Bandwidth และโหลดหน้าเว็บเร็วขึ้น
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Proxy Pass ส่งต่อไปยัง FastAPI / Uvicorn คอนเทนเนอร์ (Port 8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # รองรับ WebSockets และ HTTP Upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # ส่งต่อข้อมูล Client IP จริงสำหรับการบันทึก PDPA Audit Log
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts ป้องกัน Gateway Timeout ขณะประมวลผล AI หรือส่งออก A4
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
