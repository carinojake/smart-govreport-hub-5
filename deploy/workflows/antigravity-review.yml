name: Antigravity & Gemini Intelligent PR Review

on:
  pull_request:
    branches: [ "main", "v2.5-standalone" ]
  workflow_dispatch:

jobs:
  gemini-review:
    name: Gemini Automated Code & Gov Compliance Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai httpx pytest

      - name: Run Antigravity-Gemini Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/gemini_bridge.py --status
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/gemini_bridge.py --review
          fi
